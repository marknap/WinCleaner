[package]
name = "wincleaner"
version = "0.2.0"
description = "WinCleaner for Gamers - clean, boost and maintain Windows gaming PCs"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# native-tls uses Windows' own TLS (schannel) instead of bundling ring/rustls.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
sha2 = "0.10"
trash = "5"
walkdir = "2"
dunce = "1"
dirs = "6"
rayon = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
